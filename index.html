<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phi Delt | Payments & Shirts</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --gold: #c9a227;
            --navy: #0c1f33;
            --glass: rgba(20, 45, 76, 0.9);
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #162e4a 0%, #0c1f33 100%);
            color: #f4f0e6;
            font-family: 'Libre Baskerville', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header { text-align: center; padding: 50px 20px 10px; }
        header img { width: 70px; margin-bottom: 15px; }
        h1 { font-family: 'Cinzel', serif; color: var(--gold); letter-spacing: 3px; margin: 0; }

        .tab-container { display: flex; gap: 10px; margin: 30px 0; }
        
        .tab-btn {
            padding: 12px 25px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--gold);
            color: var(--gold);
            font-family: 'Cinzel';
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        
        .tab-btn.active { background: var(--gold); color: var(--navy); }

        .card {
            background: rgba(12, 31, 51, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(201, 162, 39, 0.3);
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px rgba(201, 162, 39, 0.1);
            display: none;
            transform: translateY(10px);
            animation: slideUp 0.4s ease forwards;
        }

        .card.active { display: block; }

        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }

        .price { font-family: 'Cinzel'; font-size: 40px; color: var(--gold); margin: 15px 0; }
        
        /* Updated to style both inputs and the new select dropdown */
        input, select {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(201, 162, 39, 0.2);
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: 'Libre Baskerville', serif;
            transition: border 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border: 1px solid var(--gold);
            background: rgba(0, 0, 0, 0.6);
        }

        /* Fix dropdown options text color */
        select option {
            background: var(--navy);
            color: white;
        }

        .primary-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4af37 0%, #aa8014 100%);
            color: var(--navy);
            border: none;
            border-radius: 6px;
            font-family: 'Cinzel';
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 1px;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(201, 162, 39, 0.2);
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(201, 162, 39, 0.4);
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

    <header>
        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/0/0b/Phi_Delta_Theta_Crest.png/250px-Phi_Delta_Theta_Crest.png">
        <h1>CHAPTER EVENTS</h1>
    </header>

    <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('dues')">Pay Dues</button>
        <button class="tab-btn" onclick="switchTab('shirt')">Buy Rush Shirt</button>
    </div>

    <!-- Dues Card -->
    <div id="dues" class="card active">
        <h2 style="font-family: 'Cinzel'; margin:0;">Member Dues</h2>
        <div class="price">Custom Amount</div>
        <input type="text" id="d-name" placeholder="Member Name">
        <input type="number" id="d-amount" placeholder="Amount ($USD)" min="1" step="any">
        <button class="primary-btn" onclick="checkout('dues')">Pay via Stripe</button>
    </div>

    <!-- Rush Shirt Card -->
    <div id="shirt" class="card">
        <h2 style="font-family: 'Cinzel'; margin:0;">Rush Shirt</h2>
        <div class="price">$25.00</div>
        <input type="text" id="s-name" placeholder="Your Name">
        <select id="s-size">
            <option value="" disabled selected>Select Shirt Size</option>
            <option value="S">Small</option>
            <option value="M">Medium</option>
            <option value="L">Large</option>
            <option value="XL">X-Large</option>
            <option value="2XL">2X-Large</option>
        </select>
        <button class="primary-btn" onclick="checkout('shirt')">Buy Shirt</button>
    </div>

    <script>
        const _supabase = supabase.createClient('https://dlrjujkapopwovjqlpew.supabase.co', 'sb_publishable_sABzmRtrGXfuU1gYSxp_TQ_EADV6vwU');

        function switchTab(id) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        async function checkout(type) {
            let payload = { type: type };

            // Grab the correct inputs based on which tab was clicked
            if (type === 'dues') {
                const name = document.getElementById('d-name').value;
                const amount = document.getElementById('d-amount').value;
                if (!name || !amount) return alert("Please fill out your name and the payment amount.");
                
                payload.name = name;
                payload.amount = parseFloat(amount);
            } else if (type === 'shirt') {
                const name = document.getElementById('s-name').value;
                const size = document.getElementById('s-size').value;
                if (!name || !size) return alert("Please fill out your name and select a shirt size.");
                
                payload.name = name;
                payload.size = size;
            }
            
            const btn = event.currentTarget;
            const originalText = btn.innerText;
            btn.innerText = "Securing...";
            btn.style.opacity = "0.7";

            try {
                // Calls your existing Supabase Edge Function
                const { data } = await _supabase.functions.invoke('resister-team-stripe', { 
                    body: payload 
                });

                if (data?.url) window.location.href = data.url;
            } catch (err) {
                alert("Connection failed. Try again.");
                btn.innerText = originalText;
                btn.style.opacity = "1";
            }
        }
    </script>
</body>
</html>
